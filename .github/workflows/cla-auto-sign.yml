name: CLA Auto Sign

on:
  issue_comment:
    types: [created]

jobs:
  auto-sign:
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the Contributor License Agreement and I hereby accept the terms')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the contributor needs adding
        id: plan
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        run: |
          if jq -e --arg user "$CONTRIBUTOR" '.contributors | index($user)' .clabot > /dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "branch=cla-accept/${CONTRIBUTOR}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Add contributor on a branch
        if: steps.plan.outputs.needed == 'true'
        env:
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          jq --arg user "$CONTRIBUTOR" '.contributors += [$user]' .clabot > .clabot.tmp
          mv .clabot.tmp .clabot
          git add .clabot
          git commit -m "chore: add $CONTRIBUTOR to CLA contributors"
          git push -u origin "$BRANCH"

      - name: Open pull request for the acceptance
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "chore: add $CONTRIBUTOR to CLA contributors" \
            --body "Records the acceptance from @$CONTRIBUTOR. Merge to let their pull request pass the CLA check."

      - name: Point the contributor at the pending acceptance
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBUTOR: ${{ github.event.comment.user.login }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Thanks @$CONTRIBUTOR. Your acceptance is recorded in a pull request that the maintainers need to merge. Once it is merged, comment \`recheck\` on this pull request."
