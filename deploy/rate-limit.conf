# AIProxyGuard Rate Limiting Configuration
#
# This file is sourced by the systemd service.
# All settings can also be passed as environment variables.

# Enable/disable rate limiting (default: true)
# Set to "false" or "0" to disable
#RATE_LIMIT_ENABLED=true

# Port to protect (default: 8080)
#RATE_LIMIT_PORT=8080

# Requests per second per IP (default: 100)
#RATE_LIMIT_RATE=100

# Burst allowance (default: 200)
#RATE_LIMIT_BURST=200

# Max concurrent connections per IP (default: 50)
#RATE_LIMIT_CONN=50

# Comma-separated IPs to whitelist (bypass rate limiting)
# Example: RATE_LIMIT_WHITELIST=10.0.0.1,192.168.1.100
#RATE_LIMIT_WHITELIST=

# Comma-separated IPs to block entirely
# Example: RATE_LIMIT_BLOCKLIST=1.2.3.4,5.6.7.8
#RATE_LIMIT_BLOCKLIST=
