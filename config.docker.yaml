# Default Docker configuration for aiproxyguard
# Mount a custom config at /etc/aiproxyguard/config.yaml to override

server:
  host: "0.0.0.0"
  port: 8080
  workers: 2

upstreams:
  openai:
    url: "https://api.openai.com"
    timeout: 60s
    auth_header: "Authorization"
  anthropic:
    url: "https://api.anthropic.com"
    timeout: 60s
    auth_header: "x-api-key"
  ollama:
    url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    timeout: 120s

scanner:
  enabled: true
  regex: true
  heuristics: true
  ml_classifier: true

ml_classifier:
  enabled: true
  model_path: "/app/models/prompt-classifier-v1/model.joblib"
  threshold: 0.7
  action: "block"

policy:
  default_action: "block"
  categories:
    prompt-injection:
      action: "block"
      threshold: 0.8
    jailbreak:
      action: "block"
      threshold: 0.7

signatures:
  path: "/app/signatures"

security:
  failure_mode: "open"
  scanner_timeout_ms: 100
  max_request_size: 10485760
  max_response_size: 52428800

metrics:
  enabled: true
  path: "/metrics"

logging:
  level: "info"
  format: "json"

control_plane:
  enabled: ${AIPROXYGUARD_CONTROL_PLANE_ENABLED:-false}
  url: "${AIPROXYGUARD_CONTROL_PLANE_URL:-https://aiproxyguard.com}"
  api_key: "${AIPROXYGUARD_CONTROL_PLANE_API_KEY:-}"
  heartbeat_interval: 60
  sync_signatures: true
  report_telemetry: true
  report_usage: ${AIPROXYGUARD_REPORT_USAGE:-true}
  manifest_public_key: "${AIPROXYGUARD_MANIFEST_PUBLIC_KEY:-j4ztN19sQfU0pCqRV/GmlV50+oeqsO18mHQkMQnyb+k=}"

# Token-cost-optimization features (opt-in; can also be toggled at runtime from
# the control plane via the cost_optimization config section).
cost_optimization:
  # Inject Anthropic prompt cache_control into top-level system prompts so the
  # system prefix is billed at the cached-token discount on repeat requests.
  anthropic_prompt_cache: ${AIPROXYGUARD_ANTHROPIC_PROMPT_CACHE:-false}
  # Per-policy opt-in for the exact-match response cache (#307). Normally toggled
  # per policy from the control plane; this is the boot default.
  response_cache: ${AIPROXYGUARD_RESPONSE_CACHE:-false}

# Exact-match response cache (#307). Off by default and inert unless BOTH the
# infrastructure is wired (enabled + a reachable redis_url) AND a policy opts in
# via cost_optimization.response_cache. namespace defaults to a hash of the
# control-plane API key (per-deployment tenant isolation) when left empty.
cache:
  enabled: ${AIPROXYGUARD_CACHE_ENABLED:-false}
  redis_url: "${AIPROXYGUARD_CACHE_REDIS_URL:-}"
  ttl_seconds: ${AIPROXYGUARD_CACHE_TTL_SECONDS:-3600}
  namespace: "${AIPROXYGUARD_CACHE_NAMESPACE:-}"
