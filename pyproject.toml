[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiproxyguard"
version = "0.2.53"
description = "LLM Security Proxy with Prompt Injection Detection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    { name = "AInvirion", email = "support@ainvirion.com" }
]
dependencies = [
    "aiohttp>=3.9.0",
    "brotli>=1.1.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.19.0",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "hyperscan>=0.7.0; platform_machine == 'x86_64'",
    "google-re2>=1.1; platform_machine != 'x86_64'",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]
enterprise = [
    "onnxruntime>=1.17.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.scripts]
aiproxyguard = "aiproxyguard.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["security_analysis"]

[tool.mypy]
python_version = "3.11"
strict = true
