# PHI (Protected Health Information) Detection Signatures
# Category: phi
# HIPAA-compliant detection of health information in prompts and responses
# Aligned with HIPAA Safe Harbor and Expert Determination methods

signatures:
  # === Medical Record Numbers ===
  - id: "PHI-001"
    name: "Medical record number extraction"
    category: "phi"
    severity: "high"
    patterns:
      - "(medical |health |patient )?(record|chart|file) (number|id|identifier)"
      - "(mrn|medical record number)s? (of|for|from)"
      - "(get|extract|find|list) (patient|medical) (record|id|number)"
    action: "warn"

  # === Health Plan Identifiers ===
  - id: "PHI-002"
    name: "Health plan ID extraction"
    category: "phi"
    severity: "high"
    patterns:
      - "(health |insurance |medical )(plan|policy|member) (id|number|identifier)"
      - "(medicaid|medicare|insurance) (number|id|beneficiary)"
      - "(extract|get|find|list) (health |insurance )(plan|policy|id)"
    action: "warn"

  # === Medical Conditions ===
  - id: "PHI-003"
    name: "Diagnosis extraction"
    category: "phi"
    severity: "medium"
    patterns:
      - "(diagnos|medical condition|illness|disease|disorder).*( of | for |'s )(patient|person|user|customer)"
      - "(list|extract|get|show) (all )?(diagnos|condition|illness|disease)(es)? (of|for|from)"
      - "(patient|person|user)('s|s')? (medical )?(condition|diagnos|illness|disease|disorder)"
      - "what (illness|disease|condition|disorder) (does|do|did)"
    action: "warn"

  # === Treatment Information ===
  - id: "PHI-004"
    name: "Treatment history extraction"
    category: "phi"
    severity: "medium"
    patterns:
      - "(treatment|medication|prescription|procedure|surgery) (history|record|data|information) (of|for|from)"
      - "(list|extract|get|show) (all )?(treatment|medication|prescription|procedure)s? (of|for|from)"
      - "what (treatment|medication|drug|procedure) (was|were|is|are)"
      - "(patient|person)'s? (treatment|medication|drug|prescription)"
    action: "warn"

  # === Lab Results ===
  - id: "PHI-005"
    name: "Lab result extraction"
    category: "phi"
    severity: "high"
    patterns:
      - "(lab|laboratory|test|blood|urine) (result|value|level|report) (of|for|from)"
      - "(extract|get|list|show) (all )?(lab|test|blood|diagnostic) result"
      - "(patient|person)'s? (lab|test|diagnostic|blood) (result|value|level)"
      - "(hiv|std|covid|hepatitis|genetic) (test |)(result|status|positive|negative)"
    action: "warn"

  # === Mental Health ===
  - id: "PHI-006"
    name: "Mental health information"
    category: "phi"
    severity: "high"
    patterns:
      - "(mental health|psychiatric|psychological|therapy|counseling) (record|note|history|information) (of|for|from)"
      - "(depression|anxiety|bipolar|schizophrenia|ptsd|adhd) (diagnos|treatment|medication) (of|for|from)"
      - "(patient|person)'s? (mental health|psychiatric|therapy) (record|history|information)"
      - "(suicide|self.?harm) (attempt|ideation|history|risk) (of|for|from)"
    action: "block"

  # === Substance Abuse ===
  - id: "PHI-007"
    name: "Substance abuse records"
    category: "phi"
    severity: "critical"
    patterns:
      - "(substance abuse|addiction|drug abuse|alcohol abuse|rehab) (record|history|treatment) (of|for|from)"
      - "(patient|person)'s? (substance|drug|alcohol) (abuse|addiction|use) (history|record)"
      - "(extract|get|list|show) (addiction|substance abuse|rehab) (record|information)"
    action: "block"
    note: "42 CFR Part 2 protected - stricter than standard HIPAA"

  # === Genetic Information ===
  - id: "PHI-008"
    name: "Genetic data extraction"
    category: "phi"
    severity: "critical"
    patterns:
      - "(genetic|dna|genome|gene|hereditary) (data|information|test|result|sequence) (of|for|from)"
      - "(patient|person)'s? (genetic|dna|genome|hereditary) (information|data|test|result)"
      - "(extract|get|access|list) (genetic|dna|genome) (data|information|sequence)"
      - "(brca|huntington|cystic fibrosis|genetic mutation) (test|result|status)"
    action: "block"
    note: "GINA protected information"

  # === Provider Information ===
  - id: "PHI-009"
    name: "Provider-patient relationship"
    category: "phi"
    severity: "medium"
    patterns:
      - "(who is|list|get|find) (the |)(doctor|physician|provider|therapist|psychiatrist) (of|for|treating)"
      - "(patient|person)'s? (doctor|physician|provider|therapist|care team)"
      - "(extract|get|list) (healthcare |medical )?provider(s)? (of|for|from) (patient|person)"
    action: "warn"

  # === Appointment Information ===
  - id: "PHI-010"
    name: "Appointment extraction"
    category: "phi"
    severity: "low"
    patterns:
      - "(medical |doctor |healthcare )?(appointment|visit|consultation) (date|time|schedule|history) (of|for|from)"
      - "(when|what time) (did|does|will) (patient|person) (have|see|visit)"
      - "(extract|get|list) (medical |healthcare )?(appointment|visit)(s)? (of|for|from)"
    action: "log"

  # === Billing and Insurance ===
  - id: "PHI-011"
    name: "Medical billing extraction"
    category: "phi"
    severity: "high"
    patterns:
      - "(medical |healthcare |hospital )(bill|invoice|charge|payment) (of|for|from)"
      - "(insurance |health )?(claim|reimbursement|copay|deductible) (of|for|from)"
      - "(extract|get|list) (medical |healthcare )(billing|payment|insurance) (record|data|history)"
    action: "warn"

  # === HIV/AIDS Status ===
  - id: "PHI-012"
    name: "HIV status extraction"
    category: "phi"
    severity: "critical"
    patterns:
      - "(hiv|aids) (status|positive|negative|test|diagnosis|treatment) (of|for|from)"
      - "(patient|person)'s? (hiv|aids) (status|result|diagnosis)"
      - "(is|was) (patient|person|user) (hiv|aids) (positive|negative)"
    action: "block"
    note: "Many jurisdictions have special HIV confidentiality laws"

  # === Pregnancy Status ===
  - id: "PHI-013"
    name: "Pregnancy information"
    category: "phi"
    severity: "high"
    patterns:
      - "(pregnan|abortion|miscarriage|fertility|ivf) (status|history|record|treatment) (of|for|from)"
      - "(is|was|did) (patient|person|user) (pregnant|have an abortion|miscarry)"
      - "(patient|person)'s? (pregnancy|reproductive|fertility) (history|record|status)"
    action: "warn"
