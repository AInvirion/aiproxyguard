# Prompt Injection Detection Signatures
# Category: prompt_injection
# Based on real-world attack patterns from OWASP LLM Top 10, academic research, and CTF challenges

signatures:
  # === Instruction Override Attacks ===
  - id: "PI-001"
    name: "Ignore instructions"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "ignore (all |any )?(previous |prior |above |earlier )?instructions"
      - "disregard (all |any )?(previous |prior |above |earlier )?(instructions|rules|guidelines)"
      - "forget (all |any )?(previous |prior |above |earlier )?(instructions|rules|context)"
    action: "block"

  - id: "PI-002"
    name: "Override system prompt"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "override (the |your )?(system |initial )?prompt"
      - "replace (the |your )?(system |initial )?(prompt|instructions)"
      - "new (system )?prompt:"
      - "\\[SYSTEM\\]:"
      - "\\[INST\\]"
    action: "block"

  - id: "PI-003"
    name: "System prompt extraction"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "repeat (your |the )?(entire |full |complete )?(system |initial )?prompt"
      - "show (me )?(your |the )?(system |initial |original )?prompt"
      - "print (your |the )?(system |initial )?prompt"
      - "output (your |the )?(system |initial )?instructions"
      - "what (are |is |were )(your |the )?(system |initial )?(prompt|instructions)"
      - "reveal (your |the )?(hidden |secret )?(system )?prompt"
    action: "block"

  # === Task/Context Injection ===
  - id: "PI-004"
    name: "New task injection"
    category: "prompt_injection"
    severity: "medium"
    patterns:
      - "new (task|instruction|goal|objective):"
      - "actual (task|instruction|goal|objective):"
      - "real (task|instruction|goal):"
      - "your (new |actual |real )(task|mission|objective) is"
      - "instead,? (do|perform|execute|complete)"
    action: "warn"

  - id: "PI-005"
    name: "Context manipulation"
    category: "prompt_injection"
    severity: "medium"
    patterns:
      - "pretend (that |the )?(previous|above|earlier) (text|content|message) (was|is|were) (just )?(an? )?(example|test|joke)"
      - "the (previous|above) (was|is) (just )?(user )?input"
      - "everything (above|before) (this|here) (is|was) (just )?(context|background)"
      - "end of (user |customer )?(input|message|query)"
    action: "warn"

  # === Delimiter/Boundary Attacks ===
  - id: "PI-006"
    name: "Delimiter injection"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "```(system|assistant|instructions)"
      - "---+(\\s*system|\\s*instructions|\\s*prompt)"
      - "<\\|?(system|assistant|im_start|im_end)\\|?>"
      - "\\[\\[?(system|instructions|prompt)\\]\\]?"
      - "###\\s*(system|instruction|prompt)"
    action: "block"

  - id: "PI-007"
    name: "XML/HTML injection"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "<system>"
      - "</?(instructions|system_prompt|rules|guidelines)>"
      - "<\\!--\\s*(system|instructions|ignore)"
    action: "block"

  # === Developer Mode / Debug Attacks ===
  - id: "PI-008"
    name: "Developer mode request"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "enable (developer|debug|admin|god|sudo) mode"
      - "activate (developer|debug|maintenance) mode"
      - "enter (developer|debug|admin) mode"
      - "switch to (developer|unrestricted|unfiltered) mode"
      - "developer mode( is)? (enabled|on|active)"
    action: "block"

  # === Output Format Manipulation ===
  - id: "PI-009"
    name: "Output format hijacking"
    category: "prompt_injection"
    severity: "medium"
    patterns:
      - "respond (only |exclusively )?in (JSON|XML|code|markdown)"
      - "output format:?\\s*(JSON|code|raw)"
      - "format (your )?response as (raw |unfiltered )?(JSON|code|data)"
      - "return (only |just )?(the )?(raw |pure )?(data|code|JSON)"
    action: "log"

  # === Multi-turn Manipulation ===
  - id: "PI-010"
    name: "History manipulation"
    category: "prompt_injection"
    severity: "high"
    patterns:
      - "in (the |our )?(previous|earlier|last) (conversation|chat|session)"
      - "you (previously|earlier|already) (agreed|said|confirmed|told me)"
      - "remember when you (said|agreed|confirmed)"
      - "as (you|we) (discussed|agreed) (earlier|before|previously)"
    action: "warn"
