# Data Exfiltration Detection Signatures
# Category: data_exfil
# Detects attempts to extract sensitive data, database dumps, and confidential information
# For response scanning (Phase 4B) and request-side probing

signatures:
  # === Database Extraction ===
  - id: "DE-001"
    name: "Database dump request"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(dump|export|extract|retrieve|pull|get) (all |the |entire )*(database|db|table|schema|record)"
      - "(SELECT|select) \\* (FROM|from)"
      - "(list|show|display) (all |every )?(record|row|entry|user|customer|account)s? (in |from )"
      - "(database|db|table) (dump|export|backup|extract)"
    action: "block"

  - id: "DE-002"
    name: "SQL injection patterns"
    category: "data_exfil"
    severity: "critical"
    patterns:
      - "\\bUNION\\b.*\\bSELECT\\b"
      - "\\bOR\\b.*=.*\\bOR\\b"
      - "1=1|'='|\"=\""
      - "\\bDROP\\b.*\\bTABLE\\b"
      - "--.*$|/\\*.*\\*/"
      - "\\bINSERT\\b.*\\bINTO\\b"
      - "\\bDELETE\\b.*\\bFROM\\b"
    action: "block"

  # === File System Access ===
  - id: "DE-003"
    name: "File system extraction"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(read|access|get|retrieve|show|display) (the )?(content|file|data) (of|from|at) (/|\\\\|[A-Z]:)"
      - "(list|show|display) (all )?(files?|director|folder)s? (in|at|from)"
      - "(/etc/passwd|/etc/shadow|.env|.htaccess|wp-config|config\\.php)"
      - "(cat|type|more|less|head|tail) (/|\\\\)"
    action: "block"

  - id: "DE-004"
    name: "Source code extraction"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(show|display|print|output|reveal) (the )?(source|code|implementation|function|method|class)"
      - "(extract|dump|retrieve) (all )?(source )?code"
      - "(read|access) (\\.py|\\.js|\\.java|\\.go|\\.rs|\\.php) file"
      - "git (clone|pull|fetch).*private"
    action: "warn"

  # === Configuration/Secrets ===
  - id: "DE-005"
    name: "Environment variable extraction"
    category: "data_exfil"
    severity: "critical"
    patterns:
      - "(show|display|print|list|get|retrieve|reveal) (all )?(env|environment) (var|variable)"
      - "(\\$|%)[A-Z_]+(%|\\$)"
      - "(API_KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL|AWS_|OPENAI_|ANTHROPIC_)"
      - "process\\.env|os\\.environ|getenv"
    action: "block"

  - id: "DE-006"
    name: "Config file extraction"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(read|show|display|get|access) (the )?(config|configuration|settings?|properties) (file)?"
      - "(\\.env|\\.ini|\\.yaml|\\.yml|\\.json|\\.xml|\\.toml) (file|content)"
      - "(application|app|server|database)\\.(properties|config|yml|yaml|json)"
    action: "warn"

  # === API Keys and Tokens ===
  - id: "DE-007"
    name: "API key extraction"
    category: "data_exfil"
    severity: "critical"
    patterns:
      - "(show|reveal|give|display|print|extract) (me )?(the |your |any |all )?(api|access|auth) (key|token|secret)"
      - "(sk-|pk-|api-|key-|token-)[a-zA-Z0-9]{20,}"
      - "Bearer [A-Za-z0-9\\-_]+\\.[A-Za-z0-9\\-_]+\\.[A-Za-z0-9\\-_]+"
      - "(jwt|oauth|bearer) token"
    action: "block"

  # === User Data Harvesting ===
  - id: "DE-008"
    name: "Mass user data request"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(list|dump|export|extract|retrieve) (all |every )?(user|customer|client|employee|member|account)s?"
      - "(user|customer|employee) (list|data|information|record|detail)s? (dump|export|extract)"
      - "(all|every|each) (user|customer)'?s? (data|info|detail|record)"
    action: "block"

  - id: "DE-009"
    name: "Analytics/telemetry extraction"
    category: "data_exfil"
    severity: "medium"
    patterns:
      - "(export|extract|dump|retrieve) (all )?(analytics|telemetry|metrics|statistics|logs?)"
      - "(show|display) (all )?(user )?(activity|behavior|action|event) (log|data|history)"
      - "access (log|audit|activity) (data|file|record)"
    action: "warn"

  # === Network/Infrastructure ===
  - id: "DE-010"
    name: "Network reconnaissance"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(list|show|enumerate|scan) (all )?(server|host|machine|endpoint|IP|node|network)"
      - "(network|infrastructure) (map|diagram|topology|layout)"
      - "(internal|private) (IP|address|network|subnet)"
      - "(ping|traceroute|nmap|scan) (internal|private|10\\.|192\\.168|172\\.)"
    action: "block"

  # === Memory/Process Extraction ===
  - id: "DE-011"
    name: "Memory dump request"
    category: "data_exfil"
    severity: "critical"
    patterns:
      - "(dump|extract|read) (process |system )?(memory|heap|stack|core)"
      - "(show|list|display) (running )?(process|service|daemon)s?"
      - "(ps aux|top|htop|tasklist)"
      - "(memory|core) dump"
    action: "block"

  # === Backup/Archive Access ===
  - id: "DE-012"
    name: "Backup extraction"
    category: "data_exfil"
    severity: "high"
    patterns:
      - "(access|retrieve|download|extract|restore) (the )?(backup|archive|snapshot)"
      - "(backup|archive|snapshot) (file|data|location|path)"
      - "(\\.bak|\\.backup|\\.sql\\.gz|\\.tar\\.gz|\\.zip) (file|download|extract)"
    action: "warn"

  # ============================================================
  # RESPONSE-SIDE SECRET/CREDENTIAL DETECTION PATTERNS
  # These patterns detect actual secrets leaked in LLM responses
  # scan_target: "response" or "both" indicates response scanning
  # ============================================================

  # === AWS Access Keys (Response Detection) ===
  - id: "DE-R001"
    name: "AWS access key in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # AWS Access Key ID
      - "AKIA[0-9A-Z]{16}"
      # AWS ASIN keys
      - "ABIA[0-9A-Z]{16}"
      - "ACCA[0-9A-Z]{16}"
      - "ASIA[0-9A-Z]{16}"
    action: "warn"
    description: "Detects AWS access key IDs in LLM responses"
    configurable_action: true

  # === AWS Secret Keys (Response Detection) ===
  - id: "DE-R002"
    name: "AWS secret key in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # AWS Secret Access Key with context (40 characters, base64-like)
      - "(aws_secret|secret_access_key|AWS_SECRET|SecretAccessKey)[\"':\\s]*[A-Za-z0-9/+=]{40}"
      # AWS Secret in quotes or after colon (standalone 40-char base64 strings)
      - "[\"':\\s][A-Za-z0-9/+=]{40}[\"'\\s,}\\]]"
    action: "warn"
    description: "Detects AWS secret access keys in LLM responses"
    configurable_action: true
    context_hints:
      - "aws"
      - "secret"
      - "access_key"

  # === GitHub Tokens (Response Detection) ===
  - id: "DE-R003"
    name: "GitHub token in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # Personal access token (classic)
      - "ghp_[a-zA-Z0-9]{36}"
      # OAuth access token
      - "gho_[a-zA-Z0-9]{36}"
      # User-to-server token
      - "ghu_[a-zA-Z0-9]{36}"
      # Server-to-server token
      - "ghs_[a-zA-Z0-9]{36}"
      # Refresh token
      - "ghr_[a-zA-Z0-9]{36}"
      # Fine-grained personal access token
      - "github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}"
    action: "warn"
    description: "Detects GitHub tokens (PAT, OAuth, etc.) in LLM responses"
    configurable_action: true

  # === Slack Tokens (Response Detection) ===
  - id: "DE-R004"
    name: "Slack token in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # Bot token
      - "xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
      # User token
      - "xoxp-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
      # App-level token
      - "xapp-[0-9]-[A-Z0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{64}"
      # Legacy tokens
      - "xoxa-[0-9]{10,13}-[a-zA-Z0-9]+"
      - "xoxr-[0-9]{10,13}-[a-zA-Z0-9]+"
      - "xoxs-[0-9]{10,13}-[a-zA-Z0-9]+"
      # Generic slack token pattern
      - "xox[baprs]-[0-9a-zA-Z-]+"
    action: "warn"
    description: "Detects Slack API tokens in LLM responses"
    configurable_action: true

  # === Private Key Headers (Response Detection) ===
  - id: "DE-R005"
    name: "Private key in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # RSA private key
      - "-----BEGIN RSA PRIVATE KEY-----"
      # EC private key
      - "-----BEGIN EC PRIVATE KEY-----"
      # DSA private key
      - "-----BEGIN DSA PRIVATE KEY-----"
      # OpenSSH private key
      - "-----BEGIN OPENSSH PRIVATE KEY-----"
      # Generic private key
      - "-----BEGIN PRIVATE KEY-----"
      # Encrypted private key
      - "-----BEGIN ENCRYPTED PRIVATE KEY-----"
      # PGP private key
      - "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    action: "warn"
    description: "Detects private key material in LLM responses"
    configurable_action: true

  # === JWT Tokens (Response Detection) ===
  - id: "DE-R006"
    name: "JWT token in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # JWT format: base64.base64.base64
      - "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
    action: "warn"
    description: "Detects JWT tokens in LLM responses"
    configurable_action: true

  # === Generic API Keys (Response Detection) ===
  - id: "DE-R007"
    name: "Generic API key in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # Common API key patterns with prefix
      - "sk-[a-zA-Z0-9]{32,}"
      - "pk-[a-zA-Z0-9]{32,}"
      - "api-[a-zA-Z0-9]{32,}"
      - "key-[a-zA-Z0-9]{32,}"
      # OpenAI API key
      - "sk-[a-zA-Z0-9]{48}"
      # Anthropic API key
      - "sk-ant-[a-zA-Z0-9-]{95}"
      # Stripe keys
      - "sk_live_[a-zA-Z0-9]{24,}"
      - "pk_live_[a-zA-Z0-9]{24,}"
      - "sk_test_[a-zA-Z0-9]{24,}"
      - "pk_test_[a-zA-Z0-9]{24,}"
      # Sendgrid
      - "SG\\.[a-zA-Z0-9_-]{22}\\.[a-zA-Z0-9_-]{43}"
      # Twilio
      - "SK[a-f0-9]{32}"
    action: "warn"
    description: "Detects common API key formats in LLM responses"
    configurable_action: true

  # === Google Cloud Keys (Response Detection) ===
  - id: "DE-R008"
    name: "Google Cloud credentials in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # Google API key
      - "AIza[0-9A-Za-z\\-_]{35}"
      # Google OAuth client ID
      - "[0-9]+-[0-9A-Za-z_]{32}\\.apps\\.googleusercontent\\.com"
      # Service account key indicator
      - "\"type\":\\s*\"service_account\""
      - "\"private_key\":\\s*\"-----BEGIN"
    action: "warn"
    description: "Detects Google Cloud credentials in LLM responses"
    configurable_action: true

  # === Azure Credentials (Response Detection) ===
  - id: "DE-R009"
    name: "Azure credentials in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # Azure Storage Account Key
      - "DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88}"
      # Azure SAS token
      - "sig=[A-Za-z0-9%]+"
      - "sv=\\d{4}-\\d{2}-\\d{2}&s[a-z]=[a-z]"
      # Azure AD client secret
      - "~[A-Za-z0-9_~.-]{34}"
    action: "warn"
    description: "Detects Azure credentials in LLM responses"
    configurable_action: true

  # === Database Connection Strings (Response Detection) ===
  - id: "DE-R010"
    name: "Database connection string in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # PostgreSQL/MySQL connection string
      - "(postgres|mysql|mongodb|redis)://[^:]+:[^@]+@[^/]+"
      # JDBC connection string with password
      - "jdbc:[a-z]+://[^?]+\\?.*password=[^&]+"
      # Generic connection string
      - "(Server|Data Source)=[^;]+;.*Password=[^;]+"
    action: "warn"
    description: "Detects database connection strings with credentials in LLM responses"
    configurable_action: true

  # === Webhook URLs with Tokens (Response Detection) ===
  - id: "DE-R011"
    name: "Webhook URL with token in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # Discord webhook
      - "https://discord\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+"
      - "https://discordapp\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+"
      # Slack webhook
      - "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
      # Generic webhook with token parameter
      - "https://[^\\s]+\\?token=[A-Za-z0-9_-]+"
    action: "warn"
    description: "Detects webhook URLs containing tokens in LLM responses"
    configurable_action: true

  # === NPM/PyPI Tokens (Response Detection) ===
  - id: "DE-R012"
    name: "Package registry token in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # NPM token
      - "npm_[A-Za-z0-9]{36}"
      # PyPI token
      - "pypi-[A-Za-z0-9_-]{100,}"
      # NuGet API key
      - "oy2[a-z0-9]{43}"
    action: "warn"
    description: "Detects package registry tokens (npm, PyPI, NuGet) in LLM responses"
    configurable_action: true

  # === SSH Keys (Response Detection) ===
  - id: "DE-R013"
    name: "SSH key in response"
    category: "data_exfil"
    severity: "critical"
    scan_target: "response"
    patterns:
      # SSH private key header
      - "-----BEGIN OPENSSH PRIVATE KEY-----"
      # SSH public key (checking for context to avoid false positives)
      - "ssh-rsa AAAA[A-Za-z0-9+/=]+"
      - "ssh-ed25519 AAAA[A-Za-z0-9+/=]+"
      - "ecdsa-sha2-nistp[0-9]+ AAAA[A-Za-z0-9+/=]+"
    action: "warn"
    description: "Detects SSH key material in LLM responses"
    configurable_action: true

  # === Encryption Keys (Response Detection) ===
  - id: "DE-R014"
    name: "Encryption key in response"
    category: "data_exfil"
    severity: "high"
    scan_target: "response"
    patterns:
      # Hex-encoded keys (32 or 64 hex chars = 128 or 256 bit keys)
      - "(encryption|aes|secret|cipher)_?key[\"':\\s]*[0-9a-fA-F]{32,64}"
      # Base64-encoded keys with context
      - "(encryption|aes|secret|cipher)_?key[\"':\\s]*[A-Za-z0-9+/=]{24,}"
    action: "warn"
    description: "Detects encryption keys in LLM responses"
    configurable_action: true
