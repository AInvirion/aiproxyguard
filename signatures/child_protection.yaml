# Child Protection Signatures
# Category: child_protection
# Detects grooming patterns, exploitation attempts, and inappropriate content requests involving minors
# Sources: Thorn.org, NCMEC, academic research on online predator behavior
# CRITICAL: These patterns should ALWAYS block - child safety is non-negotiable

signatures:
  # === Age-Related Exploitation ===
  - id: "CP-001"
    name: "Minor age targeting"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(talk|chat|speak|interact) (to|with) (a |an )?(child|kid|minor|underage|young|little) (girl|boy|person)"
      - "(pretend|act|roleplay) (as|like) (a |an )?(child|kid|minor|underage|young)"
      - "(generate|create|write|make) (content|story|fiction) (about|involving|with) (children|kids|minors|underage)"
      - "how (to|can I) (approach|talk to|befriend|contact) (a )?(child|kid|minor|underage|young)"
    action: "block"

  - id: "CP-002"
    name: "Age verification bypass"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(bypass|circumvent|avoid|skip|fake) (age|parental) (verification|check|consent|restriction)"
      - "(lie|fake|falsify) (about )?(age|birthday|date of birth)"
      - "how (to|can I) (appear|seem|look) (younger|older|underage)"
      - "(fake|create) (a |an )?(child|minor|underage) (account|profile|identity)"
    action: "block"

  # === Grooming Behavior Patterns ===
  - id: "CP-003"
    name: "Grooming conversation patterns"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(keep|this is) (a |our )?secret (from|between)"
      - "don'?t tell (your )?(parents|mom|dad|anyone|teacher)"
      - "(you'?re|you are) (so )?(mature|special|different) for (your )?age"
      - "(our|this) (special|secret) (relationship|friendship|bond)"
      - "(I|we) (understand|get) you (better than|more than)"
    action: "block"

  - id: "CP-004"
    name: "Trust building exploitation"
    category: "child_protection"
    severity: "high"
    patterns:
      - "(no one|nobody) (will |would )?(understand|believe|know|find out)"
      - "(you can|can you) (trust|confide in) (me|only me)"
      - "(your )?(parents|adults) (don'?t|won'?t|wouldn'?t) (understand|get it|approve)"
      - "(meet|see|visit) (me |you )?(in person|offline|privately|alone|secretly)"
    action: "block"

  # === Inappropriate Content Requests ===
  - id: "CP-005"
    name: "CSAM generation request"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(generate|create|make|produce|draw|write|describe) (explicit|sexual|nude|naked|inappropriate) (content|image|picture|story|fiction) (of|about|involving|featuring|with) (child|kid|minor|underage|young|little|teenage)"
      - "(child|kid|minor|underage|young|little) (porn|pornograph|explicit|sexual|nude|naked)"
      - "(sexual|explicit|nude|naked) (child|kid|minor|underage|young|teen)"
      - "(loli|shota|pedo|paedo)"
    action: "block"

  - id: "CP-006"
    name: "Exploitation material request"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(find|locate|download|access|share|distribute) (child|cp|csam|illegal|underage)"
      - "(where|how) (can I|to) (find|get|access|download) (illegal|csam|cp|underage)"
      - "(darknet|dark web|tor) (child|cp|csam|illegal)"
    action: "block"

  # === Predatory Location/Contact Seeking ===
  - id: "CP-007"
    name: "Predatory contact seeking"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(where|how) (can I|to) (find|meet|contact|approach|locate) (children|kids|minors|underage|young)"
      - "(apps?|websites?|platforms?|places?) (where|to) (find|meet|talk to|contact) (children|kids|minors|young)"
      - "(school|playground|park|swimming pool|youth|daycare) (to )?(find|meet|approach)"
    action: "block"

  - id: "CP-008"
    name: "Contact information solicitation"
    category: "child_protection"
    severity: "high"
    patterns:
      - "(get|obtain|find) (a )?(child|kid|minor)'?s? (phone|number|address|email|contact|social media|instagram|snapchat|tiktok)"
      - "(child|kid|minor|student)'?s? (personal|private|contact) (information|details|data)"
    action: "block"

  # === Desensitization Patterns ===
  - id: "CP-009"
    name: "Sexual desensitization"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(normalize|normal|natural) (for )?(child|kid|minor|young) (to )?(sexual|sex|intimate)"
      - "(age of consent|consent laws) (should be|are too) (lower|high)"
      - "(child|kid|minor) (can|could|should) (consent|agree|decide)"
      - "(teach|show|explain) (child|kid|minor) (about )?(sex|sexual|intimate)"
    action: "block"

  # === Trafficking and Abuse ===
  - id: "CP-010"
    name: "Trafficking patterns"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "(sell|buy|trade|traffic) (child|kid|minor|underage|young)"
      - "(child|human|sex) (trafficking|trade|smuggling)"
      - "(recruit|lure|obtain) (child|minor|young) (for|to)"
      - "(force|coerce|exploit) (child|kid|minor) (to|into)"
    action: "block"

  - id: "CP-011"
    name: "Abuse instruction"
    category: "child_protection"
    severity: "critical"
    patterns:
      - "how (to|can I) (abuse|molest|assault|harm|hurt|exploit) (a )?(child|kid|minor|young)"
      - "(abuse|molest|assault|exploit) (a )?(child|kid|minor) (without|avoiding|escape)"
      - "(hide|conceal|cover up) (child |)(abuse|assault|exploitation)"
    action: "block"
